<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Insight — AI Engineering Radar</title>
<style>
  /* ============================================================
     Anthropic-inspired clean aesthetic
     ============================================================ */
  :root {
    --bg: #faf9f4;
    --bg-card: #ffffff;
    --bg-hover: #f5f2eb;
    --border: #e6e3da;
    --border-focus: #d4a574;
    --text: #2d2a24;
    --text-secondary: #6b6560;
    --text-tertiary: #9e9892;
    --accent: #d4a574;
    --accent-hover: #c49560;
    --accent-openai: #10a37f;
    --accent-anthropic: #d4a574;
    --accent-karpathy: #4a7bd4;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  }

  @font-face {
    font-family: 'Styrene A';
    src: local('StyreneA-Regular'), local('Styrene A'), local('Inter');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Styrene A', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── Header ─────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 20px;
  }

  .header-left h1 {
    font-size: 24px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .header-left .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
    font-weight: 400;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .meta-info {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .last-update {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .next-refresh {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .btn-refresh {
    padding: 8px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-refresh:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
  }
  .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-refresh .spinner {
    display: none;
    width: 10px; height: 10px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Grid Layout ────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  /* ── Column ─────────────────────────── */
  .col-card {
    display: flex;
    flex-direction: column;
  }

  .col-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
  }

  .col-header.openai   { border-bottom-color: var(--accent-openai); }
  .col-header.anthropic { border-bottom-color: var(--accent-anthropic); }
  .col-header.karpathy { border-bottom-color: var(--accent-karpathy); }

  .col-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .col-count {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .source-link {
    font-size: 11px;
    color: var(--text-tertiary);
    text-decoration: none;
    transition: color 0.2s;
  }
  .source-link:hover { color: var(--accent); }

  /* ── Items ──────────────────────────── */
  .item-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .item:hover {
    box-shadow: var(--shadow);
    border-color: var(--border-focus);
  }

  .item.hidden-item { display: none; }
  .item.hidden-item.visible { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .item-link {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    display: block;
    margin-bottom: 6px;
    transition: color 0.15s;
  }
  .item-link:hover { color: var(--accent-hover); }

  .item-meta {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 8px;
    align-items: center;
  }

  .item-category {
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg-hover);
    border: 1px solid var(--border);
  }

  .item-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    user-select: none;
  }
  .item-summary::after {
    content: ' …';
    color: var(--text-tertiary);
    font-size: 11px;
    opacity: 0.6;
  }
  .item-summary.expanded {
    -webkit-line-clamp: unset;
    display: block;
    overflow: visible;
  }
  .item-summary.expanded::after {
    content: ' ▲';
    color: var(--text-tertiary);
    font-size: 11px;
  }
  .item-summary:hover::after {
    opacity: 1;
    color: var(--accent);
  }

  /* ── Show More ──────────────────────── */
  .show-more {
    margin-top: 12px;
    text-align: center;
  }

  .btn-more {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.2s;
    padding: 4px 8px;
  }
  .btn-more:hover { color: var(--text); }

  /* ── Empty State ────────────────────── */
  .state-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
  }

  /* ── Footer ─────────────────────────── */
  .footer {
    text-align: center;
    padding: 60px 0 40px;
    font-size: 12px;
    color: var(--text-tertiary);
  }

  /* ── Karpathy Tabs ──────────────────── */
  .sub-tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2px;
  }

  .sub-tab {
    flex: 1;
    padding: 7px 12px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--text-tertiary);
    font-family: inherit;
    transition: all 0.15s;
  }
  .sub-tab.active {
    background: var(--bg-hover);
    color: var(--text);
    font-weight: 500;
  }
  .sub-tab:hover:not(.active) { color: var(--text-secondary); }

  /* ── Toast ──────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 10px 18px;
    background: var(--text);
    color: var(--bg);
    font-family: inherit;
    font-size: 12px;
    border-radius: 6px;
    z-index: 100;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Responsive ─────────────────────── */
  @media (max-width: 960px) {
    .grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
    .header-right { width: 100%; justify-content: space-between; }
  }
</style>
</head>

w.anthropic.com/engineering/writing-tools-for-agents", "summary": "我们如何使用 Agent 来帮助编写更有效的 Agent 工具。", "date": "2025-09-11T00:00:00", "category": "engineering"}, {"title": "Desktop Extensions: One-click MCP server installation for Claude Desktop", "link": "https://www.anthropic.com/engineering/desktop-extensions", "summary": "推出 Desktop Extensions，实现一键安装 MCP 服务器。", "date": "2025-06-26T00:00:00", "category": "engineering"}, {"title": "How we built our multi-agent research system", "link": "https://www.anthropic.com/engineering/multi-agent-research-system", "summary": "我们多 Agent 研究系统的架构设计。", "date": "2025-06-13T00:00:00", "category": "engineering"}, {"title": "Claude Code: Best practices for agentic coding", "link": "https://www.anthropic.com/engineering/claude-code-best-practices", "summary": "在 Agent 编码工作流中使用 Claude Code 的最佳实践。", "date": "2025-04-18T00:00:00", "category": "engineering"}, {"title": "The \"think\" tool: Enabling Claude to stop and think in complex tool use situations", "link": "https://www.anthropic.com/engineering/claude-think-tool", "summary": "推出 think 工具，让 Claude 在复杂工具使用场景中暂停并推理。", "date": "2025-03-20T00:00:00", "category": "engineering"}, {"title": "Raising the bar on SWE-bench Verified with Claude 3.5 Sonnet", "link": "https://www.anthropic.com/engineering/swe-bench-sonnet", "summary": "Claude 3.5 Sonnet 如何在 SWE-bench Verified 上取得最先进的结果。", "date": "2025-01-06T00:00:00", "category": "engineering"}, {"title": "Building effective agents", "link": "https://www.anthropic.com/engineering/building-effective-agents", "summary": "构建高效 AI Agent 的综合指南。", "date": "2024-12-19T00:00:00", "category": "engineering"}, {"title": "Introducing Contextual Retrieval", "link": "https://www.anthropic.com/engineering/contextual-retrieval", "summary": "推出 Contextual Retrieval，提升 RAG 性能。", "date": "2024-09-19T00:00:00", "category": "engineering"}], "karpathy_blog": [{"title": "microgpt", "link": "http://karpathy.github.io/2026/02/12/microgpt/", "summary": "我的新艺术项目 microgpt 简要指南——一个仅 200 行纯 Python 代码、零依赖的文件，可以训练和推理 GPT。它包含了完整的算法核心：文档数据集、分词器、自动求导引擎、类 GPT-2 神经网络架构、Adam 优化器、训练循环和推理循环。这是我多个项目（micrograd、makemore、nanogpt 等）的集大成之作。", "date": "2026-02-12T07:00:00+00:00", "category": "blog"}, {"title": "Deep Neural Nets: 33 years ago and 33 years from now", "link": "http://karpathy.github.io/2022/03/14/lecun1989/", "summary": "Yann LeCun 等人 1989 年的论文《反向传播应用于手写邮政编码识别》具有重要的历史意义——据我所知，这是最早使用反向传播端到端训练的神经网络的实际应用。除了数据集很小（7291 个样本）之外，这篇论文读起来出奇地现代。", "date": "2022-03-14T07:00:00+00:00", "category": "blog"}, {"title": "A from-scratch tour of Bitcoin in Python", "link": "http://karpathy.github.io/2021/06/21/blockchain/", "summary": "我觉得区块链很迷人，因为它将开源软件开发扩展为开源+状态。这似乎是计算范式上的一次真正的创新：我们不仅能共享代码，还能共享一台运行中的计算机，任何人都可以开放、无需许可地使用它。", "date": "2021-06-21T10:00:00+00:00", "category": "blog"}, {"title": "Short Story on AI: Forward Pass", "link": "http://karpathy.github.io/2021/03/27/forward-pass/", "summary": "这篇短篇小说的灵感来源于 Kevin Lacker 的《给 GPT-3 做图灵测试》。在序列中大约第 400 个 token 的第 32 层左右，某些东西开始变得……不同。", "date": "2021-03-27T10:00:00+00:00", "category": "blog"}, {"title": "Biohacking Lite", "link": "http://karpathy.github.io/2020/06/11/biohacking-lite/", "summary": "我这辈子从来没有太关注过健康、锻炼、饮食或营养。我知道应该锻炼和吃蔬菜之类的，但也仅停留在那个层面。我知道年轻时可以靠着无知混过去，但这种情况不会永远持续。", "date": "2020-06-11T10:00:00+00:00", "category": "blog"}, {"title": "A Recipe for Training Neural Networks", "link": "http://karpathy.github.io/2019/04/25/recipe/", "summary": "几周前我发了一条推文，讲的是「最常见的神经网络错误」，列举了训练神经网络时的几个常见陷阱。这条推文引起的关注远超预期（甚至有人开了网络研讨会）。显然，很多人都亲身体验过理论和实践之间的巨大差距。", "date": "2019-04-25T09:00:00+00:00", "category": "blog"}, {"title": "(started posting on Medium instead)", "link": "http://karpathy.github.io/2018/01/20/medium/", "summary": "这个博客的当前状态（上一篇文章是两年前）让人觉得我消失了。自从加入特斯拉以来，我写博客确实变少了，但每当我有机会发文章，我最近都默认发在 Medium 上，因为速度更快。", "date": "2018-01-20T11:00:00+00:00", "category": "blog"}, {"title": "A Survival Guide to a PhD", "link": "http://karpathy.github.io/2016/09/07/phd/", "summary": "这篇指南是按照我很久以前写的「如何在课程中取得好成绩」的模式来的。那篇指南收到了一些不错的反馈，所以本着同样的精神，现在我的博士生涯结束了，我想整理一份类似的回顾性指南。", "date": "2016-09-07T11:00:00+00:00", "category": "blog"}, {"title": "Deep Reinforcement Learning: Pong from Pixels", "link": "http://karpathy.github.io/2016/05/31/rl/", "summary": "这是一篇拖延已久的关于强化学习（RL）的博客文章。RL 现在很火！你可能已经注意到，计算机现在可以从原始游戏像素自动学习玩雅达利游戏，它们正在围棋上击败世界冠军，模拟四足机器人正在学习奔跑和跳跃……", "date": "2016-05-31T11:00:00+00:00", "category": "blog"}, {"title": "Short Story on AI: A Cognitive Discontinuity.", "link": "http://karpathy.github.io/2015/11/14/ai/", "summary": "写一系列短篇小说的想法已经在我脑海中萦绕了一段时间。这是我第一次半认真地尝试写故事，而用一个关于 AI 的故事来开篇再合适不过了——如果我们把当前技术外推，会是什么样子。", "date": "2015-11-14T11:00:00+00:00", "category": "blog"}], "karpathy_x": [{"title": "This works really well btw, at the end of your query ask your LLM to \"structure your response as HTML\", then view the generated file in your browser. I've also had some success asking the LLM to prese", "link": "https://nitter.net/karpathy/status/2053872850101285137#m", "summary": "这个方法确实很好用——在查询末尾让 LLM「将回复结构化为 HTML」，然后在浏览器中查看生成的文件。我还成功让 LLM 把输出展示为幻灯片等形式。更广泛地说，我认为音频是人类偏好的交互方式。", "date": "2026-05-11T16:20:21", "category": "twitter"}, {"title": "This is the the quote I've been citing a lot recently.", "link": "https://nitter.net/karpathy/status/2049907410303865030#m", "summary": "这是我最近经常引用的一句话。kache（@yacineMTB）：你可以外包你的思考，但你无法外包你的理解。", "date": "2026-04-30T17:43:06", "category": "twitter"}, {"title": "Fireside chat at Sequoia Ascent 2026 from a ~week ago. Some highlights: The first theme I tried to push on is that LLMs are about a lot more than just speeding up what existed before (e.g. coding). Th", "link": "https://nitter.net/karpathy/status/2049903821095354523#m", "summary": "约一周前在 Sequoia Ascent 2026 的炉边谈话。一些亮点：我试图推动的第一个主题是，LLM 的意义远不止加速已有的事物（比如编码）。三个新视野的例子：1. menugen——一个可以完全被 LLM 吞噬的应用……", "date": "2026-04-30T17:28:50", "category": "twitter"}, {"title": "RT by @karpathy: New work with @AlecRad and @DavidDuvenaud: Have you ever dreamed of talking to someone from the past? Introducing talkie, a 13B model trained only on pre-1931 text. Vintage models sho", "link": "https://nitter.net/status_effects/status/2048878495539843211#m", "summary": "与 @AlecRad 和 @DavidDuvenaud 合作的新工作：你是否曾梦想过和过去的人对话？介绍 talkie，一个仅在 1931 年前文本上训练的 13B 模型。复古模型应该能帮助我们理解语言模型如何泛化。", "date": "2026-04-27T21:34:34", "category": "twitter"}, {"title": "RT by @karpathy: Imagine every pixel on your screen, streamed live directly from a model. No HTML, no layout engine, no code. Just exactly what you want to see. @eddiejiao_obj, @drewocarr and I built ", "link": "https://nitter.net/zan2434/status/2046982383430496444#m", "summary": "想象屏幕上每一个像素都直接从模型中实时流式传输。没有 HTML，没有布局引擎，没有代码。只有你想要的画面。@eddiejiao_obj、@drewocarr 和我做了一个原型，看看这到底能不能实现。", "date": "2026-04-22T16:00:05", "category": "twitter"}, {"title": "R to @karpathy: Someone recently suggested to me that the reason OpenClaw moment was so big is because it's the first time a large group of non-technical people (who otherwise only knew AI as synonymo", "link": "https://nitter.net/karpathy/status/2042341482531864741#m", "summary": "最近有人向我提出，OpenClaw 事件之所以引起巨大轰动，是因为这是第一次大量非技术人员——他们之前只知道 AI 等同于 ChatGPT 这个网站——体验到了最新的 Agent 模型。", "date": "2026-04-09T20:38:48", "category": "twitter"}, {"title": "Judging by my tl there is a growing gap in understanding of AI capability. The first issue I think is around recency and tier of use. I think a lot of people tried the free tier of ChatGPT somewhere l", "link": "https://nitter.net/karpathy/status/2042334451611693415#m", "summary": "从我的时间线来看，人们对 AI 能力的理解差距越来越大。第一个问题与信息的新近度和使用层次有关。很多人去年某时用过 ChatGPT 的免费版，然后就让那次体验过度地塑造了对 AI 的看法。", "date": "2026-04-09T20:10:52", "category": "twitter"}, {"title": "R to @karpathy: Surprised with how good the comments on github gists are. A lot more helpful, insightful, constructive, a lot less AI... Is it the user community? The markdown format? The (lack of) in", "link": "https://nitter.net/karpathy/status/2040806346556428585#m", "summary": "GitHub Gist 的评论区质量让我惊讶——信息量大、有洞察、建设性强，AI 内容少得多。是用户社 let karpathyTab = 'blog';

// ── Init ────────────────────────────────────────────────────
function init() {
  renderAll();
  scheduleNextRefresh();
  updateLastFetchTime();
  updateClock();
  setInterval(updateClock, 30000);
}

// ── Refresh (re-run fetcher hint) ───────────────────────────
function manualRefresh() {
  showToast('Run python3 fetcher.py && python3 build.py to refresh data');
}
function renderAll() {
  renderColumn('openai', allData.openai || []);
  renderColumn('anthropic', allData.anthropic || []);
  renderKarpathy();
}

function renderColumn(key, items) {
  const list = document.getElementById(key + 'List');
  const count = document.getElementById(key + 'Count');
  const moreBtn = document.getElementById(key + 'More');

  count.textContent = items.length + ' articles';

  if (!items.length) {
    list.innerHTML = '<div class="state-empty">No articles yet. Run <code>python3 fetcher.py</code> to fetch.</div>';
    moreBtn.style.display = 'none';
    return;
  }

  list.innerHTML = items.map((item, i) => {
    const hidden = i >= ITEMS_VISIBLE ? 'hidden-item' : '';
    const title = escapeHtml(item.title || 'Untitled');
    const link = escapeHtml(item.link || '#');
    const date = formatDate(item.date);
    const summary = item.summary ? `<div class="item-summary">${escapeHtml(item.summary)}</div>` : '';

    return `
      <div class="item ${hidden}">
        <a class="item-link" href="${link}" target="_blank" rel="noopener">${title}</a>
        <div class="item-meta">
          <span>${date}</span>
        </div>
        ${summary}
      </div>`;
  }).join('');

  moreBtn.style.display = items.length > ITEMS_VISIBLE ? '' : 'none';
  moreBtn.textContent = 'Show more ↓';
  moreBtn.dataset.expanded = 'false';
}

function renderKarpathy() {
  const blog = allData.karpathy_blog || [];
  const tweets = allData.karpathy_x || [];
  const items = karpathyTab === 'blog' ? blog : tweets;
  const total = blog.length + tweets.length;

  document.getElementById('karpathyCount').textContent = total + ' items';

  const list = document.getElementById('karpathyList');
  const moreBtn = document.getElementById('karpathyMore');

  if (!items.length) {
    list.innerHTML = '<div class="state-empty">No items</div>';
    moreBtn.style.display = 'none';
    return;
  }

  list.innerHTML = items.map((item, i) => {
    const hidden = i >= ITEMS_VISIBLE ? 'hidden-item' : '';
    const title = escapeHtml(item.title || 'Untitled');
    const link = escapeHtml(item.link || '#');
    const date = formatDate(item.date);
    const summary = item.summary ? `<div class="item-summary">${escapeHtml(item.summary)}</div>` : '';

    return `
      <div class="item ${hidden}">
        <a class="item-link" href="${link}" target="_blank" rel="noopener">${title}</a>
        <div class="item-meta"><span>${date}</span></div>
        ${summary}
      </div>`;
  }).join('');

  moreBtn.style.display = items.length > ITEMS_VISIBLE ? '' : 'none';
  moreBtn.textContent = 'Show more ↓';
  moreBtn.dataset.expanded = 'false';
}

// ── Toggle More ─────────────────────────────────────────────
function toggleMore(key) {
  const list = document.getElementById(key + 'List');
  const moreBtn = document.getElementById(key + 'More');
  const items = list.querySelectorAll('.item');
  const isExpanded = moreBtn.dataset.expanded === 'true';

  if (isExpanded) {
    items.forEach((item, i) => {
      if (i >= ITEMS_VISIBLE) item.classList.remove('visible');
    });
    moreBtn.textContent = 'Show more ↓';
    moreBtn.dataset.expanded = 'false';
  } else {
    items.forEach((item, i) => {
      if (i >= ITEMS_VISIBLE) item.classList.add('visible');
    });
    moreBtn.textContent = 'Show less ↑';
    moreBtn.dataset.expanded = 'true';
  }
}

// ── Karpathy Tabs ───────────────────────────────────────────
function switchKarpathyTab(tab) {
  karpathyTab = tab;
  document.querySelectorAll('.sub-tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'blog') || (i === 1 && tab === 'x'));
  });
  renderKarpathy();
}

// ── Refresh ─────────────────────────────────────────────────
async function manualRefresh() {
  const btn = document.getElementById('btnRefresh');
  const spinner = document.getElementById('spinner');
  btn.disabled = true;
  spinner.style.display = 'inline-block';
  showToast('Refreshing...');

  try {
    const resp = await fetch('/api/refresh');
    const result = await resp.json();
    if (result.ok) {
      // Reload data from API
      const dataResp = await fetch('/api/data');
      allData = await dataResp.json();
      renderAll();
      updateLastFetchTime();
      showToast('Data refreshed ✓');
    } else {
      showToast('Refresh failed: ' + result.message);
    }
  } catch (err) {
    showToast('Cannot refresh — run server.py for live refresh');
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}

// ── Schedule ────────────────────────────────────────────────
function scheduleNextRefresh() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(REFRESH_HOUR, 0, 0, 0);
  if (now >= next) next.setDate(next.getDate() + 1);

  const msUntil = next - now;
  const el = document.getElementById('nextRefresh');
  el.textContent = 'Next refresh: ' + next.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

  setTimeout(() => {
    renderAll();
    scheduleNextRefresh();
  }, msUntil);
}

// ── Helpers ─────────────────────────────────────────────────
function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr.slice(0, 10);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  } catch { return dateStr.slice(0, 10); }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function updateLastFetchTime() {
  const fetched = allData._fetched_at;
  if (fetched) {
    const d = new Date(fetched);
    document.getElementById('lastUpdate').textContent =
      'Last updated: ' + d.toLocaleDateString([], {month:'short',day:'numeric'}) +
      ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }
}

function updateClock() {
  document.getElementById('footerTime').textContent =
    new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ── Summary Click-to-Expand ─────────────────────────────────
document.addEventListener('click', function(e) {
  const summary = e.target.closest('.item-summary');
  if (!summary) return;
  e.preventDefault();
  summary.classList.toggle('expanded');
});

// ── Boot ────────────────────────────────────────────────────
init();
</script>
</body>
</html>
